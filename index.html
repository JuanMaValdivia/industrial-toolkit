        <div class="field"><label for="v-r">TREMA o tasa de descuento (% anual)</label><input id="v-r" type="number" step="any"></div>
        <div class="field" style="grid-column:1/-1"><label for="v-f">Flujos netos de efectivo por año, separados por coma (año 1, año 2, …). Incluye el valor de rescate en el último.</label><input id="v-f"></div>
      </div><div id="v-out"></div></div>`;
    const load=E=>{$('#v-i').value=E.I;$('#v-r').value=E.r;$('#v-f').value=E.f.join(', ');run()};
    $('#v-ex1').onclick=()=>load(VAN_EJ); $('#v-ex2').onclick=()=>load(VAN_EJ2);
    ['v-i','v-r','v-f'].forEach(i=>$('#'+i).addEventListener('input',run)); load(VAN_EJ);
    function run(){
      const I=+$('#v-i').value, rp=+$('#v-r').value, f=$('#v-f').value.split(/[\s,;]+/).filter(Boolean).map(Number), o=$('#v-out');
      if(!(I>0)) return o.innerHTML='<p class="err">La inversión inicial debe ser mayor que cero.</p>';
      if(!Number.isFinite(rp)||rp<=-100) return o.innerHTML='<p class="err">Captura una tasa de descuento válida, por ejemplo 12.</p>';
      if(!f.length||f.some(v=>!Number.isFinite(v))) return o.innerHTML='<p class="err">Captura los flujos de cada año como números separados por comas.</p>';
      if(f.length>30) return o.innerHTML='<p class="err">Usa como máximo 30 años.</p>';
      if(!f.some(v=>v>0)) return o.innerHTML='<p class="err">Ningún flujo es positivo: el proyecto nunca recupera la inversión.</p>';
      const r=rp/100, V=npv(I,f,r), roots=irrAll(I,f), signs=[-I,...f].filter(v=>v!==0).reduce((c,v,i,a)=>c+(i&&Math.sign(v)!==Math.sign(a[i-1])?1:0),0);
      const pbS=payback(I,f,0), pbD=payback(I,f,r), IR=(V+I)/I;
      const gates=[{s:signs<=1?'ok':'warn',t:signs<=1?'Flujos convencionales: una inversión seguida de ingresos. La TIR es única.':`El signo de los flujos cambia ${signs} veces: puede haber varias TIR o ninguna. Decide con el VAN.`},
        {s:'warn',t:'Supone flujos de efectivo incrementales después de impuestos, y tasa y flujos en los mismos términos (nominales o reales).'}];
      const tirTxt=roots.length===1?fmt(roots[0]*100,2)+' %':roots.length?roots.map(x=>fmt(x*100,1)+' %').join(' y '):'No existe';
      // flujos chart
      const W=560,H=210,L=10,T=14,B=26,pw=W-20,ph=H-T-B, n=f.length, bw=pw/(n+1);
      let acc=-I; const cum=[acc]; f.forEach((F,t)=>{acc+=F/Math.pow(1+r,t+1);cum.push(acc)});
      const all=[-I,...f,...cum], lo=Math.min(0,...all), hi=Math.max(0,...all), ys=v=>T+ph-(v-lo)/((hi-lo)||1)*ph, xc=i=>L+i*bw+bw/2;
      let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flujos y flujo acumulado descontado">`;
      [-I,...f].forEach((F,i)=>{svg+=`<rect x="${xc(i)-bw*.3}" y="${Math.min(ys(F),ys(0))}" width="${bw*.6}" height="${Math.abs(ys(F)-ys(0))}" rx="2" fill="${F<0?'var(--bad)':'var(--accent)'}" opacity=".55"/><text x="${xc(i)}" y="${H-8}" text-anchor="middle">${i===0?'Hoy':'Año '+i}</text>`});
      svg+=`<line x1="${L}" x2="${L+pw}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--muted)"/><polyline fill="none" stroke="var(--fg)" stroke-width="2" points="${cum.map((v,i)=>`${xc(i)},${ys(v)}`).join(' ')}"/>${cum.map((v,i)=>`<circle cx="${xc(i)}" cy="${ys(v)}" r="3" fill="var(--fg)"/>`).join('')}</svg>`;
      // perfil VAN
      const rmax=Math.max(0.4,...roots.map(x=>x*1.6),r*2), pts=Array.from({length:81},(_,k)=>{const x=-0.05+(rmax+0.05)*k/80;return [x,npv(I,f,x)]});
      const vlo=Math.min(0,...pts.map(p=>p[1])), vhi=Math.max(0,...pts.map(p=>p[1])), xs2=x=>L+(x+0.05)/(rmax+0.05)*pw, ys2=v=>T+ph-(v-vlo)/((vhi-vlo)||1)*ph;
      let svg2=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil del VAN según la tasa">`;
      svg2+=`<line x1="${L}" x2="${L+pw}" y1="${ys2(0)}" y2="${ys2(0)}" stroke="var(--muted)"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p=>`${xs2(p[0])},${ys2(p[1])}`).join(' ')}"/>`;
      svg2+=`<line x1="${xs2(r)}" x2="${xs2(r)}" y1="${T}" y2="${T+ph}" stroke="var(--fg)" stroke-dasharray="4 3"/><text x="${xs2(r)+4}" y="${T+10}">TREMA ${fmt(rp,1)} %</text>`;
      roots.forEach(x=>{if(x>=-0.05&&x<=rmax)svg2+=`<circle cx="${xs2(x)}" cy="${ys2(0)}" r="5" fill="var(--bad)"/><text x="${xs2(x)+8}" y="${ys2(0)-8}">TIR ${fmt(x*100,1)} %</text>`});
      svg2+=`<text x="${L}" y="${H-4}">${fmt(-5,0)} %</text><text x="${L+pw}" y="${H-4}" text-anchor="end">${fmt(rmax*100,0)} %</text></svg>`;
      const ok=V>0;
      o.innerHTML=`<div class="verdict ${Math.abs(V)<I*0.005?'v-warn':ok?'v-ok':'v-bad'}"><span class="light"></span>${ok?`Conviene: a una TREMA de ${fmt(rp,1)} %, el proyecto genera $${fmt(V,0)} por encima de lo exigido.`:`No conviene: a una TREMA de ${fmt(rp,1)} %, el proyecto destruye $${fmt(-V,0)} de valor.`}</div>
        <ul class="gates">${gates.map(g=>`<li><span class="g ${g.s}">${g.s==='ok'?'✓':'!'}</span><span>${g.t}</span></li>`).join('')}</ul>
        <div class="kpis"><div class="kpi"><small>VAN</small><div class="v" style="color:var(${ok?'--ok':'--bad'})">$${fmt(V,0)}</div></div><div class="kpi"><small>TIR</small><div class="v">${tirTxt}</div></div><div class="kpi"><small>Recuperación simple / descontada</small><div class="v">${pbS==null?'—':fmt(pbS,1)} / ${pbD==null?'—':fmt(pbD,1)}</div><small>años</small></div><div class="kpi"><small>Índice de rentabilidad</small><div class="v">${fmt(IR,2)}</div><small>valor presente por $1 invertido</small></div></div>
        <div class="duo"><figure><figcaption>Flujos por año y flujo acumulado descontado</figcaption>${svg}</figure><figure><figcaption>Perfil del VAN: cómo cambia con la tasa</figcaption>${svg2}</figure></div>
        ${dataTable('Flujo, flujo descontado y acumulado por año',['Año','Flujo','Descontado','Acumulado descontado'],[[0,'$'+fmt(-I,0),'$'+fmt(-I,0),'$'+fmt(-I,0)],...f.map((F,t)=>[t+1,'$'+fmt(F,0),'$'+fmt(F/Math.pow(1+r,t+1),0),'$'+fmt(cum[t+1],0)])])}
        <div class="interp">${roots.length===1?`La TIR (${tirTxt}) ${roots[0]>r?'supera':'no alcanza'} la TREMA, consistente con el VAN. `:roots.length>1?'Con varias TIR, ninguna sirve para decidir; el VAN sí. ':''}${pbD!=null?`La inversión se recupera, ya descontada, en ${fmt(pbD,1)} años de ${f.length}.`:'Con esta tasa, la inversión no se recupera dentro del horizonte.'} Para comparar proyectos que se excluyen entre sí, elige el de mayor VAN, no el de mayor TIR.</div>`;
    }
  },
  productividad(el){
    const P=PRODUCT, f=(id,lab,v)=>`<div class="field"><label for="${id}">${lab}</label><input id="${id}" type="number" min="0" step="any" value="${v}"></div>`;
    el.innerHTML=`<div class="calc"><div class="calc-head"><h3>Productividad: antes y después</h3></div>
      <div style="padding:12px 16px 0"><p class="note" style="margin:0">Ejemplo ficticio: una oficina de trámites con 4 personas que trabajan 8 horas al día instala un sistema nuevo. Valores por día.</p></div>
      <div class="calc-in"><div style="display:grid;gap:10px"><span class="label">Antes</span>${f('p-u0','Producción (unidades)',P.antes.u)}${f('p-h0','Horas de trabajo',P.antes.h)}${f('p-m0','Costo de mano de obra ($)',P.antes.mo)}${f('p-o0','Otros costos: materiales, energía, gastos generales ($)',P.antes.otros)}</div>
      <div style="display:grid;gap:10px"><span class="label">Después</span>${f('p-u1','Producción (unidades)',P.despues.u)}${f('p-h1','Horas de trabajo',P.despues.h)}${f('p-m1','Costo de mano de obra ($)',P.despues.mo)}${f('p-o1','Otros costos ($)',P.despues.otros)}</div></div>
      <div id="p-out2"></div></div>`;
    el.querySelectorAll('input').forEach(x=>x.addEventListener('input',run)); run();
    function run(){
      const g=id=>+$('#'+id).value, o=$('#p-out2'), v=[0,1].map(i=>({u:g('p-u'+i),h:g('p-h'+i),c:g('p-m'+i)+g('p-o'+i)}));
      if(v.some(x=>!(x.u>0&&x.h>0&&x.c>0))) return o.innerHTML='<p class="err">Producción, horas y costos deben ser mayores que cero.</p>';
      const lab=v.map(x=>x.u/x.h), mf=v.map(x=>x.u/x.c*1000), dl=(lab[1]/lab[0]-1)*100, dm=(mf[1]/mf[0]-1)*100;
      const bar=(p)=>{const w=Math.min(Math.abs(p),100);return `<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1;justify-content:${p<0?'flex-end':'flex-start'}"><i style="width:${w}%;background:var(${p<0?'--bad':'--ok'})"></i></div><b class="mono" style="min-width:64px;text-align:right;color:var(${p<0?'--bad':'--ok'})">${p>0?'+':''}${fmt(p,1)} %</b></div>`};
      o.innerHTML=`<div class="tscroll" style="padding:0 16px 8px;border-top:1px solid var(--line)"><table class="etable" style="margin-top:12px"><thead><tr><th>Indicador</th><th style="text-align:right">Antes</th><th style="text-align:right">Después</th><th style="min-width:180px">Cambio</th></tr></thead><tbody>
        <tr><td>Laboral (unidades por hora)</td><td class="out">${fmt(lab[0],3)}</td><td class="out">${fmt(lab[1],3)}</td><td>${bar(dl)}</td></tr>
        <tr><td>Multifactorial (unidades por $1,000)</td><td class="out">${fmt(mf[0],2)}</td><td class="out">${fmt(mf[1],2)}</td><td>${bar(dm)}</td></tr></tbody></table></div>
        <div class="interp">${dl>0&&dm>0&&dm<dl*0.6?`La productividad laboral sube ${fmt(dl,0)} %, pero la multifactorial solo ${fmt(dm,0)} %: el cambio también aumentó otros costos. Revisa ambas antes de concluir.`:dl>0&&dm<0?`La productividad laboral mejora, pero la multifactorial empeora: el cambio cuesta más de lo que aporta.`:`Laboral: ${dl>0?'+':''}${fmt(dl,1)} %. Multifactorial: ${dm>0?'+':''}${fmt(dm,1)} %.`}</div>`;
    }
  }
};

function histLimit(x,lim,limLabel,axis){
  const W=560,H=210,L=10,R=10,T=26,B=30,pw=W-L-R,ph=H-T-B, lo=Math.floor(Math.min(...x,lim)-1), hi=Math.ceil(Math.max(...x,lim)+1), k=(hi-lo)<=20?(hi-lo):14, bw=(hi-lo)/k;
  const bins=Array(k).fill(0); x.forEach(v=>bins[Math.min(k-1,Math.floor((v-lo)/bw))]++);
  const m=Math.max(...bins), xs=v=>L+(v-lo)/(hi-lo)*pw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histograma">`;
  bins.forEach((c,i)=>{const h=c/m*ph,x0=lo+i*bw; if(c) s+=`<rect x="${xs(x0)+1}" y="${T+ph-h}" width="${pw/k-2}" height="${h}" rx="1" fill="${x0>=lim?'var(--bad)':'var(--accent)'}" opacity=".8"/><text x="${xs(x0+bw/2)}" y="${T+ph-h-3}" text-anchor="middle">${c}</text>`});
  s+=`<line x1="${xs(lim)}" x2="${xs(lim)}" y1="${T-8}" y2="${T+ph}" stroke="var(--bad)" stroke-width="2"/><text x="${xs(lim)}" y="${T-12}" text-anchor="middle">${limLabel}</text>`;
  s+=`<line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)"/><text x="${L}" y="${H-14}">${lo}</text><text x="${L+pw}" y="${H-14}" text-anchor="end">${hi}</text><text x="${W/2}" y="${H-2}" text-anchor="middle">${axis}</text></svg>`;
  return s;
}
function boxSVG(groups,lim){
  const D=groups.map(([n,x])=>({name:n,x,...desc(x)})), lo=Math.floor(Math.min(...D.map(d=>d.min),lim??Infinity)-1), hi=Math.ceil(Math.max(...D.map(d=>d.max),lim??-Infinity)+1);
  const W=560,rowH=70,H=D.length*rowH+30,L=10,pw=W-20,xs=v=>L+(v-lo)/(hi-lo)*pw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Boxplot por grupo">`;
  if(lim!=null) s+=`<line x1="${xs(lim)}" x2="${xs(lim)}" y1="4" y2="${H-16}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${xs(lim)+4}" y="12">promesa ${lim}</text>`;
  D.forEach((d,i)=>{const y=10+i*rowH, c=i?'var(--warn)':'var(--accent)';
    s+=`<text x="${L}" y="${y+10}" style="font-weight:700;fill:var(--fg)">${esc(d.name)} · media ${fmt(d.mean,1)} · σ ${fmt(d.sd,1)}</text>`;
    d.x.forEach((v,j)=>s+=`<circle cx="${xs(v)}" cy="${y+22+((j*7)%9)}" r="2.5" fill="${lim!=null&&v>lim?'var(--bad)':'var(--muted)'}"/>`);
    s+=`<line x1="${xs(d.wlo)}" x2="${xs(d.whi)}" y1="${y+48}" y2="${y+48}" stroke="${c}" stroke-width="1.5"/><rect x="${xs(d.q1)}" y="${y+38}" width="${Math.max(1,xs(d.q3)-xs(d.q1))}" height="20" fill="${c}" opacity=".25" stroke="${c}"/><line x1="${xs(d.med)}" x2="${xs(d.med)}" y1="${y+38}" y2="${y+58}" stroke="${c}" stroke-width="2.5"/>`;});
  s+=`<line x1="${L}" x2="${L+pw}" y1="${H-16}" y2="${H-16}" stroke="var(--muted)"/><text x="${L}" y="${H-3}">${lo} min</text><text x="${L+pw}" y="${H-3}" text-anchor="end">${hi} min</text></svg>`;
  return s;
}
function fishSVG(ef,c){
  const W=760,H=380,sy=190,x0=20,headX=640,bx=[270,450,630], L=105, V=150;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de causa y efecto">`;
  s+=`<line x1="${x0}" x2="${headX}" y1="${sy}" y2="${sy}" stroke="var(--fg)" stroke-width="3"/>`;
  const words=ef.split(/\s+/), lines=[''];
  words.forEach(w=>{if((lines[lines.length-1]+' '+w).trim().length>14&&lines[lines.length-1])lines.push(w);else lines[lines.length-1]=(lines[lines.length-1]+' '+w).trim()});
  const ls=lines.slice(0,4);
  s+=`<rect x="${headX}" y="${sy-50}" width="${W-headX-4}" height="100" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>`;
  ls.forEach((t,i)=>s+=`<text x="${(headX+W-4)/2}" y="${sy-(ls.length-1)*8+i*16+4}" text-anchor="middle" style="fill:var(--accent);font-family:var(--display);font-size:13px;font-weight:700">${esc(t)}</text>`);
  SIXM.forEach((m,k)=>{
    const top=k<3, b=bx[k%3], dir=top?-1:1, ex=b-L, ey=sy+dir*V;
    s+=`<line x1="${b}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--muted)" stroke-width="2"/>`;
    s+=`<text x="${ex}" y="${top?ey-10:ey+18}" text-anchor="middle" style="fill:var(--accent);font-family:var(--body);font-size:12px;font-weight:700">${m}</text>`;
    const cs=c[k].slice(0,5), n=cs.length;
    cs.forEach((t,j)=>{const sp=0.92-j*(0.75/Math.max(n,1)), px=b-L*sp, py=sy+dir*V*sp;
      s+=`<line x1="${px-58}" y1="${py}" x2="${px}" y2="${py}" stroke="var(--line)" stroke-width="1.5"/><text x="${px-60}" y="${py-3}" text-anchor="end" style="font-family:var(--body);font-size:10px;fill:var(--fg)"><title>${esc(t)}</title>${esc(t.length>22?t.slice(0,21)+'…':t)}</text>`});
  });
  return s+'</svg>';
}

function render(){
  const h=(location.hash||'#inicio').slice(1), app=$('#app');
  let nav='';
  if(h.startsWith('f-')){ app.innerHTML=viewFicha(h.slice(2)); nav='herramientas'; const f=FICHAS[h.slice(2)]; if(f&&f.calc&&CALCS[f.calc]) CALCS[f.calc]($('#calc')); }
  else if(h.startsWith('caso-')){ app.innerHTML=viewCaso(h.slice(5)); nav='casos'; renderCase(); }
  else if(h==='herramientas'){app.innerHTML=viewTools();nav=h}
  else if(h==='curso'||h.startsWith('curso-')){let k=h.slice(6);if(!COURSES[k]){try{k=localStorage.getItem('it-course')}catch(_){}} if(!COURSES[k])k='cep';try{localStorage.setItem('it-course',k)}catch(_){} app.innerHTML=viewCurso(k);nav='curso'}
  else if(h.startsWith('post-')){ const id=h.slice(5); app.innerHTML=viewPost(id); nav='radar'; const p=POSTS.find(x=>x.id===id); if(p&&p.widget&&$('#pw')) POST_WIDGETS[p.widget]($('#pw')); }
  else if(h==='experimento'){app.innerHTML=viewExperimento();nav='casos';initExperimento()}
  else if(h==='casos'){app.innerHTML=viewCasos();nav=h}
  else if(h==='plantillas'){app.innerHTML=viewPlantillas();nav=h}
  else if(h==='radar'){app.innerHTML=viewRadar();nav=h}
  else if(h==='autor'){app.innerHTML=viewAutor();nav=h}
  else if(h==='presentacion'){app.innerHTML=viewPresentacion();nav='herramientas'}
  else if(h==='proyecto'){app.innerHTML=viewProyecto()}
  else if(h==='creditos'){app.innerHTML=viewCreditos()}
  else { app.innerHTML=viewHome(); }
  document.querySelectorAll('nav.main a').forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cat]');
  if(c){ currentCat=c.dataset.cat; try{localStorage.setItem('it-cat',currentCat)}catch(_){}
    document.querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===currentCat)); $('#panel').innerHTML=panel();
    if(window.innerWidth<820){ const rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; $('#panel').scrollIntoView({behavior:rm?'auto':'smooth',block:'start'}); } }
  const g=e.target.closest('[data-goto-cat]');
  if(g){ currentCat=g.dataset.gotoCat; try{localStorage.setItem('it-cat',currentCat)}catch(_){} }
  const o=e.target.closest('[data-opt]');
  if(o&&caseState){ const i=+o.dataset.opt, st=CASOS[caseState.id].steps[caseState.step];
    const a=caseState.ans[caseState.step]||(caseState.ans[caseState.step]={picked:[],first:null,solved:false});
    if(a.solved) return; a.picked.push(i); a.last=i; if(a.first===null) a.first=!!st.o[i][1]; if(st.o[i][1]) a.solved=true; renderCase(); }
  if(e.target.closest('[data-case-next]')){ caseState.step++; renderCase(); }
  if(e.target.closest('[data-case-restart]')){ caseState={id:caseState.id,step:0,ans:[]}; renderCase(); }
  const cc=e.target.closest('[data-copycode]');
  if(cc){ copyText(cc.parentElement.querySelector('pre').innerText); }
  const cp=e.target.closest('[data-copy]');
  if(cp){ const t=PLANTILLAS.find(x=>x.id===cp.dataset.copy); copyText([t.h.join('\t'),...t.r().map(r=>r.join('\t'))].join('\n')); }
  if(e.target.closest('#sug-btn')){ const s=$('#sug'); toast(s.value.trim()?'En el sitio publicado, tu sugerencia se guardaría aquí.':'Escribe tu pregunta primero.'); }
});
window.addEventListener('hashchange',()=>{ if(!location.hash.startsWith('#caso-')) caseState=null; clearTimeout(XP.timer); if(XP.phase==='wait'||XP.phase==='go') XP.phase='idle'; render(); });
document.addEventListener('keydown',e=>{ if(location.hash==='#experimento'&&e.key===' '&&document.activeElement.tagName!=='INPUT'&&document.activeElement.id!=='xp'){ e.preventDefault(); xpPress(); } });
(function(){ if(/(^|\.)github\.io$/.test(location.hostname)){ $('#visits-wrap').innerHTML='<img src="https://hits.sh/juanmavaldivia.github.io/industrial-toolkit.svg?label=Visitas&amp;color=1f5fd1&amp;labelColor=16202e" alt="Contador de visitas" height="20" style="vertical-align:middle;display:inline-block">'; return; }
  let v=1; try{ v=(+localStorage.getItem('it-visits')||0)+1; localStorage.setItem('it-visits',v); }catch(_){}
  $('#visits').innerHTML=String(v).padStart(5,'0').split('').map(d=>`<b>${d}</b>`).join('');
  $('#visits').title='Contador de demostración: solo cuenta en este navegador'; })();
