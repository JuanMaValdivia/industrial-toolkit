<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="description" content="Herramientas interactivas para ingenieros industriales: encuentra la herramienta, entiende la fórmula y aplícala con un ejemplo.">
<meta name="theme-color" content="#1f5fd1">
<style>
/* Estilos base que en el artifact agrega Claude */
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Industrial Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de ingeniería — cuadrícula tenue en la portada, columna de lectura de ~70ch en fichas, herramientas como paneles de instrumento */
:root{
  --bg:#f6f8fb; --surface:#ffffff; --sunk:#eef2f7; --line:#d9e0ea; --grid:#e6ebf2;
  --fg:#16202e; --muted:#5a6779; --accent:#1f5fd1; --accent-soft:#e3ecfb; --accent-fg:#ffffff;
  --ok:#1d8a55; --ok-soft:#e2f4ea; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#c23a32; --bad-soft:#fbe5e3;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#161d28; --sunk:#1c2532; --line:#2a3546; --grid:#1a2230;
  --fg:#e5ebf3; --muted:#9aa7b9; --accent:#6ea0ff; --accent-soft:#1c2c4a; --accent-fg:#0b1220;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#e3aa4a; --warn-soft:#33270f; --bad:#f07067; --bad-soft:#3a1a18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#161d28; --sunk:#1c2532; --line:#2a3546; --grid:#1a2230;
  --fg:#e5ebf3; --muted:#9aa7b9; --accent:#6ea0ff; --accent-soft:#1c2c4a; --accent-fg:#0b1220;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#e3aa4a; --warn-soft:#33270f; --bad:#f07067; --bad-soft:#3a1a18;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0}
.wrap{max-width:1080px;margin:0 auto}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Barra superior */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:6px 10px;border-radius:6px}
nav.main a:hover{color:var(--fg);background:var(--sunk)}
nav.main a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Portada */
.hero{padding-block:56px 32px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.hero-in{max-width:1080px;margin:0 auto}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.025em}
.hero p.sub{font-size:19px;color:var(--muted);margin:12px 0 0;max-width:46ch}
.slogan{display:inline-block;margin-bottom:14px;font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:4px}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:32px}
@media (max-width:820px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.cats{grid-template-columns:1fr}}
.cat{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--accent)}
.cat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.cat .ic{flex:none;width:38px;height:38px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--accent)}
.cat[aria-pressed="true"] .ic{background:var(--surface)}
.cat strong{display:block;font-family:var(--display);font-size:17px;font-weight:700}
.cat span.d{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}

.panel{margin-block:24px 8px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head h2{font-size:22px}
.qlist{display:grid;gap:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:var(--fg)}
.q:hover{border-color:var(--accent)}
.q .qt{font-weight:600;font-size:17px}
.q .tool{font-size:14px;color:var(--muted)}
.q .arrow{color:var(--accent);font-weight:700}
@media (max-width:560px){.q{grid-template-columns:minmax(0,1fr) auto}.q .arrow{display:none}}
.ask{font-size:15px;color:var(--muted);margin-top:14px}

/* Chips de nivel */
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.lvl b{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}

/* Ficha */
.crumbs{font-size:14px;color:var(--muted);padding-block:20px 0}
.crumbs a{color:var(--muted)}
.fhead{padding-block:12px 24px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.fhead h1{font-size:clamp(28px,4.5vw,40px);font-weight:800;letter-spacing:-.02em}
.fhead .tool-name{font-family:var(--mono);font-size:14px;color:var(--accent)}
.meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.levels a,.levels span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--muted);background:var(--surface)}
.levels a.on{border-color:var(--accent);color:var(--accent)}
.levels span.off{opacity:.55;text-decoration:line-through}

.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;padding-block:28px}
@media (max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr)}.aside{order:-1}}
.fbody{display:grid;gap:36px;min-width:0}
.sec h2{font-size:21px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.sec h2 .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}
.sec p{margin:0 0 10px;max-width:70ch}
.formula{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:16px;overflow-x:auto;display:grid;gap:8px}
.formula div small{display:block;font-family:var(--body);color:var(--muted);font-size:13px}
table.vars{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}
table.vars th,table.vars td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.vars th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.vars td:first-child{font-family:var(--mono);white-space:nowrap}
.tscroll{overflow-x:auto}
.conds{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.conds li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-top:2px}
.tag.block{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.steps li{max-width:70ch}
.result{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;max-width:70ch}
ul.errs{margin:0;padding-left:20px;display:grid;gap:6px}
.refs{font-size:14px;color:var(--muted);display:grid;gap:4px}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;border:1px dashed var(--line);border-radius:8px}

.aside{display:grid;gap:16px;align-content:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.box a.res{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--fg);font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.box a.res:last-child{border-bottom:0}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.free{background:var(--ok-soft);color:var(--ok)}
.pill.paid{background:var(--accent-soft);color:var(--accent)}
.pill.todo{background:var(--sunk);color:var(--muted)}

/* Calculadora */
.calc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.calc-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sunk)}
.calc-head h3{font-size:16px}
.calc-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;padding:16px}
@media (max-width:640px){.calc-in{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{font-family:var(--mono);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.field textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;padding:0 16px 12px}

.verdict{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-weight:600}
.light{width:14px;height:14px;border-radius:50%;flex:none}
.v-ok .light{background:var(--ok)} .v-ok{background:var(--ok-soft);color:var(--ok)}
.v-warn .light{background:var(--warn)} .v-warn{background:var(--warn-soft);color:var(--warn)}
.v-bad .light{background:var(--bad)} .v-bad{background:var(--bad-soft);color:var(--bad)}
.gates{list-style:none;margin:0;padding:12px 16px;display:grid;gap:6px;border-top:1px solid var(--line)}
.gates li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px}
.gates .g{font-weight:700}
.g.ok{color:var(--ok)} .g.warn{color:var(--warn)} .g.bad{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 16px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .v.na{font-size:14px;color:var(--bad);font-family:var(--body);font-weight:600;padding-block:6px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px;border-top:1px solid var(--line)}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.charts figure{margin:0;min-width:0}
.charts figcaption{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.interp{padding:14px 16px;border-top:1px solid var(--line);font-size:15px;max-width:80ch}

/* Páginas secundarias */
.page{padding-block:32px;display:grid;gap:24px}
.page h1{font-size:clamp(28px,4.5vw,40px);font-weight:800;letter-spacing:-.02em}
.page .lead{font-size:18px;color:var(--muted);max-width:60ch;margin:0}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.idx section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:8px;align-content:start}
.idx h2{font-size:17px}
.idx a{display:flex;justify-content:space-between;gap:8px;align-items:center;text-decoration:none;color:var(--fg);padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:0;padding-left:18px;font-size:15px;color:var(--muted)}
.slot{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);font-size:15px;text-align:center}
.note{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:12px 14px;max-width:80ch}

footer{border-top:1px solid var(--line);margin-top:48px;padding-block:20px 32px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
footer .cc{font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2: casos, plantillas, Gantt, actividad ===== */
.seclead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seclead h2{font-size:22px}
.home-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:8px}
.case-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.case-card:hover{border-color:var(--accent)}
.case-card svg{width:96px;height:64px;border-radius:6px;background:var(--sunk)}
.case-card strong{font-family:var(--display);font-size:16px;display:block}
.case-card span{font-size:14px;color:var(--muted)}

/* Caso interactivo */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper span{flex:1 1 60px;height:6px;border-radius:3px;background:var(--line)}
.stepper span.done{background:var(--ok)} .stepper span.cur{background:var(--accent)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.case-top{padding:16px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--sunk)}
.case-top h2{font-size:20px}
.case-vis{padding:16px;border-bottom:1px solid var(--line)}
.case-q{padding:16px;display:grid;gap:10px}
.case-q h3{font-size:18px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--fg);border-left:3px solid var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--fg);border-left:3px solid var(--bad)}
.case-nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--display);font-size:40px;font-weight:800;color:var(--accent)}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.statline div{background:var(--surface);padding:10px 12px}
.statline b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.statline small{color:var(--muted);font-size:12px}

/* Tablas editables */
.etable{width:100%;border-collapse:collapse;font-size:14px}
.etable th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;font-weight:600}
.etable td{padding:3px}
.etable input{width:100%;font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
.etable td.out{font-family:var(--mono);font-size:13px;text-align:right;padding:6px 8px;white-space:nowrap}
.etable tr.crit td.out{color:var(--accent);font-weight:600}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px}
.xbtn:hover{color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 16px 12px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Selector */
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.reco{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line)}
.reco .big{font-family:var(--display);font-weight:800;font-size:34px;color:var(--accent)}

/* Plantillas */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.sheet{background:var(--sunk);padding:12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.sheet table{border-collapse:collapse;font-family:var(--mono);font-size:11px;background:var(--surface);min-width:100%}
.sheet th,.sheet td{border:1px solid var(--line);padding:3px 6px;white-space:nowrap;text-align:left}
.sheet th{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sheet td.rn{color:var(--muted);background:var(--sunk);text-align:center}
.tpl-body{padding:14px 16px;display:grid;gap:8px;align-content:start}
.tpl-body h3{font-size:16px}
.tpl-body p{margin:0;font-size:14px;color:var(--muted)}
.tpl-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fmt{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:10}

/* Autor y actividad */

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative;align-items:start}
.tl li>span{min-width:0;display:grid;gap:2px}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:5px;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:5px;top:17px;bottom:0;width:2px;background:var(--line)}
.tl b{display:block}
.tl .mono{display:block}
.tl span{color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.player{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.player svg{display:block;width:100%;height:auto}
.chapters{list-style:none;margin:0;padding:8px 0}
.chapters li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 16px;font-size:14px}
.chapters li b{font-family:var(--mono);font-weight:500;color:var(--accent)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slide .thumb{aspect-ratio:16/9;max-width:100%;padding:16px;display:grid;align-content:space-between;background:linear-gradient(135deg,var(--accent) 0%,var(--accent) 38%,var(--accent-soft) 38%);color:var(--accent-fg)}
.slide .thumb.b{background:linear-gradient(160deg,var(--fg) 0%,var(--fg) 55%,var(--sunk) 55%);color:var(--bg)}
.slide .thumb strong{font-family:var(--display);font-size:18px;line-height:1.15;max-width:70%}
.slide .thumb small{font-family:var(--mono);font-size:11px;opacity:.9}
.slide .info{padding:12px 14px;display:grid;gap:6px;font-size:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.post svg{display:block;width:100%;height:auto}
.post .pb{padding:14px 16px;display:grid;gap:8px;align-content:start}
.post h3{font-size:17px}
.post p{margin:0;font-size:14px;color:var(--muted)}
.post .pm{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-family:var(--mono)}
.req{display:grid;gap:8px}
.req a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.req a:hover{border-color:var(--accent)}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.mid{background:var(--warn-soft);color:var(--warn)} .st.no{background:var(--sunk);color:var(--muted)}
.req small{color:var(--muted);font-size:13px;display:block}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.odo{display:inline-flex;gap:2px;vertical-align:middle}
.odo b{font-family:var(--mono);font-weight:500;background:var(--fg);color:var(--bg);padding:1px 5px;border-radius:3px;font-size:13px}
.cc{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.cc i{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center}
footer .fl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* ===== v4: curso, Ishikawa, ABC, pedidos ===== */
.band{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 20px;border-radius:12px;background:var(--fg);color:var(--bg);text-decoration:none}
.band strong{font-family:var(--display);font-size:18px;display:block}
.band span.sm{font-size:14px;opacity:.8}
.band .go{font-weight:700;white-space:nowrap}
.course{display:grid;gap:14px}
.cl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative}
.cl:not(:last-child)::after{content:"";position:absolute;left:21px;top:48px;bottom:-14px;width:2px;background:var(--line)}
.cl .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--accent);color:var(--accent-fg);position:relative;z-index:1}
.cl .num.off{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.cl .cbody{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.cl h2{font-size:18px}
.cl .links{display:grid;gap:6px}
.cl .links a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--fg);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
.cl .links a:hover{border-color:var(--accent)}
.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.six textarea{min-height:84px;font-family:var(--body)}
.abc{font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.abc.A{background:var(--accent);color:var(--accent-fg)} .abc.B{background:var(--accent-soft);color:var(--accent)} .abc.C{background:var(--sunk);color:var(--muted)}
.months{display:flex;gap:6px;flex-wrap:wrap}
.months label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:var(--bg)}
.months label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ===== v5: CEP ===== */
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:700px){.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k5 .kpi:last-child{grid-column:span 2}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.xp{width:100%;height:240px;border-radius:12px;display:grid;place-items:center;align-content:center;gap:6px;font-family:var(--display);font-size:clamp(20px,4vw,30px);font-weight:800;cursor:pointer;border:2px solid var(--line);background:var(--sunk);color:var(--fg);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.xp small{font-family:var(--body);font-size:15px;font-weight:500;color:inherit;opacity:.85}
.xp.wait{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.xp.go{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.xp.early{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.xp.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tries{display:flex;gap:4px;flex-wrap:wrap}
.tries span{font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.tries span.out{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sigma{position:relative;height:56px;margin:8px 0 4px}
.sigma .track{position:absolute;left:0;right:0;top:18px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bad) 0%,var(--warn) 45%,var(--ok) 100%);opacity:.8}
.sigma .mk{position:absolute;top:8px;width:4px;height:32px;background:var(--fg);border-radius:2px;transform:translateX(-2px)}
.sigma .lb{position:absolute;top:38px;font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateX(-50%)}

.codebox{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.codebox .btn{position:absolute;top:8px;right:8px}
pre.code{margin:0;padding:44px 16px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--fg)}
.article code{font-family:var(--mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.article pre code{background:none;padding:0;font-size:inherit}
.pend{color:var(--warn);font-style:italic}
/* ===== v10: presentación ===== */
.pres{display:block;width:100%;height:clamp(560px,82vh,860px);border:1px solid var(--line);border-radius:12px;background:#f5f7fb}
/* ===== v9: leyenda y datos accesibles ===== */
.lv-legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.lv-legend b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.dt{padding:0 16px 12px}
.dt summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:600;padding:6px 0;width:fit-content}
.dt table{margin-top:6px}
.dt td{text-align:left!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== v8: revisión ===== */
@media (max-width:640px){
  header.top{gap:10px}
  nav.main{flex-wrap:nowrap;overflow-x:auto;width:100%;margin-inline:-4px;padding-bottom:4px;scrollbar-width:none}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{white-space:nowrap;flex:none}
  svg.chart text{font-size:16px}
}

.fbody>*,.aside>*{min-width:0}

/* ===== v7: artículos ===== */
.article{max-width:74ch;margin:0 auto;display:grid;gap:16px;padding-block:24px 8px}
.article h1{font-size:clamp(28px,4.5vw,40px);font-weight:800;letter-spacing:-.02em}
.article h2{font-size:22px;margin-top:14px}
.article p,.article li{font-size:17px;line-height:1.65}
.article p{margin:0}
.article ul,.article ol{margin:0;padding-left:22px;display:grid;gap:6px}
.article .lead{font-size:20px;color:var(--muted);line-height:1.5}
.article .meta{font-size:14px}
.article .eq{font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;overflow-x:auto;font-size:15px}
.opinion{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:0 8px 8px 0;display:grid;gap:6px}
.opinion .label{color:var(--warn)}
.fact{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;border-top:1px solid var(--line)}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.duo figure{margin:0;min-width:0}
.duo figcaption{font-size:13px;font-weight:600;margin-bottom:6px}
.post a.read{font-weight:700}

  }
  return {orders:orders.filter(Boolean).length, oc, hc, total:oc+hc, end, qty};
}
function bestPlan(d,S,h){
  let best=null; const n=d.length;
  for(let m=0;m<(1<<(n-1));m++){const o=[true];for(let i=1;i<n;i++)o.push(!!(m&(1<<(i-1))));const r=lotPlan(d,o,S,h);if(!best||r.total<best.r.total)best={o,r}}
  return best;
}
function lotStrategies(d,S,h){
  const n=d.length, list=[
    {n:'Todo al inicio', o:d.map((_,i)=>i===0)},
    {n:'Cada mes', o:d.map(()=>true)}];
  if(n>=3) list.push({n:'Lotes de 2 meses', o:d.map((_,i)=>i%2===0)});
  list.forEach(x=>x.r=lotPlan(d,x.o,S,h));
  const b=bestPlan(d,S,h); list.push({n:'Mejor plan posible', o:b.o, r:b.r});
  return list;
}

  {id:'ied-2026-s1', tipo:'noticia', k:'ied', f:'Qué cambió', t:'Inversión extranjera en México: récord en el primer semestre, pero casi todo es reinversión',
   d:'México captó 34,968 millones de dólares entre enero y junio de 2026. La manufactura recibió el 38.6 %. Solo 7.8 % fueron inversiones nuevas. Qué significa para el ingeniero industrial.',
   l:'van', fecha:'24 de agosto de 2026', status:'pub',
   refs:['Secretaría de Economía (24 de agosto de 2026). <a href="https://www.gob.mx/se/prensa/mexico-registra-un-maximo-historico-de-inversion-extranjera-directa-ied-para-un-primer-semestre-34-mil-968-millones-de-dolares-en-2026" target="_blank" rel="noopener">México registra un máximo histórico de Inversión Extranjera Directa (IED) para un primer semestre</a>. Comunicado núm. 79.','El Financiero (25 de agosto de 2026). <a href="https://www.elfinanciero.com.mx/economia/2026/08/25/inversion-extranjera-directa-ied-en-mexico-alcanza-nivel-historico-al-cierre-del-primer-semestre/" target="_blank" rel="noopener">Inversión extranjera directa en México alcanza nivel histórico al cierre del primer semestre</a>.','Expansión (24 de agosto de 2026). <a href="https://expansion.mx/economia/2026/08/24/ied-mexico-record-primer-semestre-2026" target="_blank" rel="noopener">IED rompe récord en México en el primer semestre, pero crecimiento se modera a 2.1 %</a>.','IMCO (2026). <a href="https://imco.org.mx/inversion-extranjera-directa-en-mexico-primer-trimestre-de-2026/" target="_blank" rel="noopener">Inversión Extranjera Directa en México, primer trimestre de 2026</a>.'],
   body:`<p class="lead">El 24 de agosto de 2026, la Secretaría de Economía informó que México recibió 34,968 millones de dólares de inversión extranjera directa (IED) en el primer semestre, el monto más alto registrado para un periodo de enero a junio.</p>
<h2>¿Qué ocurrió?</h2>
<p><span class="fact">Hecho</span> Según el comunicado oficial, la IED creció 2.1 % frente a lo publicado para el primer semestre de 2025. Su composición fue:</p>
<div class="tscroll"><table class="etable"><thead><tr><th>Tipo de inversión</th><th style="text-align:right">Millones de dólares</th><th style="text-align:right">% del total</th></tr></thead><tbody>
<tr><td>Reinversión de utilidades</td><td class="out">30,957</td><td class="out">88.5 %</td></tr>
<tr><td>Nuevas inversiones</td><td class="out">2,726</td><td class="out">7.8 %</td></tr>
<tr><td>Cuentas entre compañías</td><td class="out">1,285</td><td class="out">3.7 %</td></tr>
<tr class="crit"><td>Total</td><td class="out">34,968</td><td class="out">100 %</td></tr></tbody></table></div>
<p>La manufactura fue el sector que más recibió: 13,482 millones de dólares, el 38.6 % del total, 9.3 % más que en el mismo periodo de 2025. Estados Unidos fue el principal origen, con 48.2 %.</p>
<h2>¿Qué significa?</h2>
<p><span class="fact">Análisis del autor</span> El récord se explica casi por completo por empresas que ya operan en México y reinvierten sus ganancias. Las inversiones nuevas, que son las que suelen traer plantas nuevas, pesan menos de 8 %. El comunicado no usa la palabra nearshoring, y con estos datos no se puede afirmar que estemos viendo una ola de fábricas nuevas.</p>
<p>Para un ingeniero industrial, eso cambia dónde están las oportunidades: menos en arrancar plantas desde cero y más en <strong>ampliar y mejorar las que ya existen</strong>. Eso significa capacidad, productividad, calidad y automatización en operaciones en marcha.</p>
<h2>¿A quién le sirve?</h2>
<ul><li><strong>Estudiantes:</strong> para orientar la búsqueda de prácticas hacia empresas manufactureras ya instaladas que están reinvirtiendo.</li><li><strong>Ingenieros en planta:</strong> los proyectos de ampliación compiten por presupuesto. Saber justificarlos con VAN y TIR es una ventaja.</li><li><strong>Profesores:</strong> un ejemplo actual para hablar de estrategia de operaciones y localización.</li></ul>
<h2>¿Qué limitaciones tiene?</h2>
<p><span class="fact">Hecho</span> Son cifras nominales, en dólares corrientes, y preliminares: la Secretaría de Economía las actualiza en publicaciones posteriores. Además, analistas señalan que la IED registrada por estado suele reflejar dónde está la oficina corporativa, no dónde está la planta.</p>
<div class="opinion"><span class="label">Opinión del autor</span><p>Un récord nominal suena bien en un titular, pero para decisiones conviene mirar la composición. El dato que yo seguiría trimestre a trimestre es el de nuevas inversiones, no el total.</p></div>
<h2>¿Dónde aprenderlo o probarlo?</h2>
<p>Si trabajas en una planta que está por ampliarse, practica con la ficha de <a href="#f-van">VAN y TIR</a> para evaluar una inversión, la de <a href="#f-cuello">capacidad y cuello de botella</a> para saber dónde invertir primero, y la de <a href="#f-productividad">productividad</a> para medir el resultado.</p>`},

  {id:'gartner-top25-2026', tipo:'noticia', k:'ranking', f:'Qué cambió', t:'Gartner publica su ranking 2026 de las mejores cadenas de suministro',
   d:'Schneider Electric repite en el primer lugar por cuarto año; NVIDIA es segundo y Walmart sube 10 lugares hasta el tercero. Qué industrias dominan y qué significa para un ingeniero industrial.',
   l:'abc', fecha:'17 de junio de 2026', status:'pub',
   refs:['Gartner (17 de junio de 2026). <a href="https://www.gartner.com/en/newsroom/press-releases/2026-06-17-gartner-announces-2026-rankings-of-the-global-supply-chain-top-25" target="_blank" rel="noopener">Gartner Announces 2026 Rankings of the Global Supply Chain Top 25</a>. Comunicado de prensa.','Supply Chain 24/7 (17 de junio de 2026). <a href="https://www.supplychain247.com/article/gartner-2026-global-supply-chain-top-25-rankings" target="_blank" rel="noopener">Gartner Unveils 2026 Top 25 Supply Chain Rankings</a>.','Lenovo (22 de junio de 2026). <a href="https://news.lenovo.com/pressroom/press-releases/gartner-supply-chain-top-25-for-2026/" target="_blank" rel="noopener">Lenovo Recognized in the Gartner Supply Chain Top 25 for 2026</a>. Comunicado de prensa.'],
   body:`<p class="lead">El 17 de junio de 2026, Gartner publicó su ranking anual de las 25 empresas con las mejores cadenas de suministro del mundo. Schneider Electric conservó el primer lugar por cuarto año consecutivo.</p>
<h2>¿Qué ocurrió?</h2>
<p><span class="fact">Hecho</span> Los primeros cinco lugares del Gartner Supply Chain Top 25 de 2026 son:</p>
<div class="tscroll"><table class="etable"><thead><tr><th>Lugar</th><th>Empresa</th><th>Dato</th></tr></thead><tbody>
<tr><td class="out">1</td><td>Schneider Electric</td><td>Cuarto año consecutivo en el primer lugar</td></tr>
<tr><td class="out">2</td><td>NVIDIA</td><td></td></tr>
<tr><td class="out">3</td><td>Walmart</td><td>Subió 10 lugares</td></tr>
<tr><td class="out">4</td><td>Cisco Systems</td><td></td></tr>
<tr><td class="out">5</td><td>AstraZeneca</td><td></td></tr></tbody></table></div>
<p>Según la cobertura de Supply Chain 24/7, completan los primeros diez Danone, Lenovo, L'Oréal, Johnson &amp; Johnson y Microsoft. Aparte del ranking, Gartner reconoce como <strong>Masters</strong> a las empresas que han estado entre las cinco mejores en al menos 7 de los últimos 10 años. En 2026 son Amazon, Apple, Procter &amp; Gamble y Unilever.</p>
<h2>¿Qué industrias dominan?</h2>
<p><span class="fact">Análisis del autor</span> Agrupando a las empresas que menciona la cobertura del ranking:</p>
<ul><li><strong>Tecnología y electrónica:</strong> NVIDIA, Cisco, Lenovo, Microsoft y TSMC.</li><li><strong>Consumo y retail:</strong> Walmart, Danone, L'Oréal, Colgate-Palmolive e Inditex.</li><li><strong>Farmacéutica:</strong> AstraZeneca, Johnson &amp; Johnson y GSK.</li><li><strong>Equipo industrial y automotriz:</strong> Schneider Electric y Toyota.</li></ul>
<p>Son industrias donde la cadena de suministro es una ventaja competitiva: productos con mucha variedad, demanda difícil de pronosticar o redes globales de proveedores.</p>
<h2>¿A quién le sirve?</h2>
<ul><li><strong>Estudiantes que buscan prácticas o su primer empleo:</strong> estas empresas son referentes en planeación de la demanda, inventarios y logística. Varias tienen operaciones importantes en México.</li><li><strong>Profesores:</strong> es material actual para discutir estrategia de operaciones. Apple, que analizamos en el curso de Administración de Operaciones, aparece entre los Masters.</li><li><strong>Ingenieros en la industria:</strong> sirve para comparar prácticas de su empresa con las de los líderes.</li></ul>
<h2>¿Qué limitaciones tiene?</h2>
<p><span class="fact">Hecho</span> Gartner evalúa la madurez y el liderazgo de la cadena de suministro de empresas grandes. El reporte completo, con la metodología detallada, requiere registrarse en el sitio de Gartner.</p>
<div class="opinion"><span class="label">Opinión del autor</span><p>No es un ranking de los mejores lugares para trabajar: no mide sueldos, ambiente laboral ni oportunidades de crecimiento. Para eso conviene revisar fuentes como Great Place to Work o las opiniones de empleados. Lo que sí indica es dónde se practica la ingeniería industrial con más madurez, y eso es valioso para quien quiere aprender rápido.</p></div>
<h2>¿Dónde aprenderlo o probarlo?</h2>
<p>Las prácticas que distinguen a estas empresas empiezan con herramientas que puedes practicar aquí: <a href="#f-abc">clasificación ABC</a> para enfocar el control del inventario, <a href="#f-pedidos">planificación de pedidos</a>, <a href="#f-errores">comparación de pronósticos</a> y <a href="#f-van">evaluación de inversiones con VAN y TIR</a>.</p>`},
  {id:'cognex-insight-3900', tipo:'noticia', k:'vision', f:'Qué cambió', t:'Cognex lanza un sistema de visión con IA para inspeccionar a la velocidad de la línea',
   d:'El In-Sight 3900 hace inspecciones con IA dentro de la cámara, sin una computadora externa. Qué promete, qué falta comprobar y por qué no reemplaza al control estadístico.',
   l:'dpmo', fecha:'5 de mayo de 2026', status:'pub',
   refs:['Cognex (5 de mayo de 2026). <a href="https://www.prnewswire.com/news-releases/cognex-launches-highest-performance-embedded-ai-vision-system-powered-by-qualcomm-302760462.html" target="_blank" rel="noopener">Cognex Launches Highest Performance Embedded AI Vision System Powered by Qualcomm</a>. Comunicado de prensa, PR Newswire.'],
   body:`<p class="lead">El 5 de mayo de 2026, Cognex, uno de los principales fabricantes de visión artificial industrial, presentó el In-Sight 3900: un sistema que ejecuta inspecciones con inteligencia artificial dentro del propio equipo, sin una computadora externa.</p>
<h2>¿Qué ocurrió?</h2>
<p><span class="fact">Hecho</span> Según el comunicado de la empresa:</p>
<ul><li>Hace inspecciones hasta 4 veces más rápidas que la generación anterior de sistemas de Cognex.</li><li>Trabaja con imágenes de hasta 25 megapíxeles.</li><li>Combina herramientas de IA con herramientas tradicionales basadas en reglas.</li><li>Se comunica con PLC, robots y sistemas de la empresa.</li><li>Está dirigido a líneas de empaque, automotriz, electrónica y bienes de consumo.</li></ul>
<p>Un cliente del sector empaque, Fuji Seal, explica en el comunicado que la velocidad de sus líneas antes los limitaba a herramientas tradicionales de lectura de caracteres, y que ahora pueden usar lectura con IA a velocidad de producción.</p>
<h2>¿A quién le sirve?</h2>
<ul><li><strong>Ingenieros de calidad</strong> en líneas rápidas, donde muestrear a mano no alcanza.</li><li><strong>Estudiantes:</strong> la inspección automática es un área en crecimiento que combina calidad, datos y automatización.</li><li><strong>Profesores:</strong> un ejemplo concreto para discutir la diferencia entre inspeccionar y controlar un proceso.</li></ul>
<h2>¿Qué limitaciones tiene?</h2>
<p><span class="fact">Hecho</span> Las cifras de desempeño vienen del propio fabricante y comparan contra sus productos anteriores, no contra la competencia ni en una prueba independiente. El comunicado no publica precio. Un sistema con IA necesita imágenes etiquetadas para entrenarse y volver a validarse cuando cambia el producto.</p>
<div class="opinion"><span class="label">Opinión del autor</span><p>La visión artificial mejora la <strong>detección</strong>: encuentra el defecto en cada pieza, no en una muestra. Pero detectar no es prevenir. Si el sistema rechaza más piezas cada día, el proceso está cambiando, y eso lo dice una gráfica de control, no la cámara. Lo ideal es usar los datos de la inspección automática para alimentar el control estadístico del proceso.</p></div>
<h2>¿Dónde aprenderlo o probarlo?</h2>
<p>Los rechazos que registra un sistema de visión son datos de atributos. Con ellos puedes vigilar la estabilidad en la ficha de <a href="#f-pchart">gráficas p y np</a> o <a href="#f-cuchart">c y u</a>, medir el desempeño con <a href="#f-dpmo">DPMO y nivel sigma</a>, y priorizar con un <a href="#f-pareto">Pareto</a> de los tipos de defecto.</p>`},  {id:'limites', k:'practica', f:'Del concepto a la práctica', t:'Límites de control: por qué no usar la desviación de todos los datos',
   d:'Si calculas los límites con la desviación de todos los datos, el propio cambio del proceso ensancha los límites y la alarma no suena.',
   l:'imr', fecha:'Octubre de 2026', status:'pub', widget:'limites',
   refs:['NIST/SEMATECH e-Handbook of Statistical Methods, sec. 6.3.2, Individuals control charts.','Montgomery, D. C. Introduction to Statistical Quality Control. Wiley. Capítulo de gráficas de control para variables.','Wheeler, D. J. y Chambers, D. S. (1992). Understanding Statistical Process Control (2.ª ed.). SPC Press.'],
   body:`<p class="lead">Una gráfica de control existe para avisar cuando el proceso cambia. Si calculas sus límites con la desviación estándar de todos los datos, el propio cambio ensancha los límites y la alarma no suena.</p>
<h2>La pregunta: ¿qué desviación va en los límites?</h2>
<p>Los límites de una gráfica de individuales son la media ± 3σ. La duda está en cómo estimar σ. Hay dos caminos:</p>
<ul><li><strong>Desviación global (s):</strong> se calcula con todos los datos, como en cualquier hoja de cálculo.</li><li><strong>Desviación dentro del proceso (σ̂ = MR̄ / 1.128):</strong> se estima con los rangos móviles, es decir, con la diferencia entre cada dato y el anterior.</li></ul>
<p>Si el proceso es estable, ambas dan valores parecidos. El problema aparece cuando no lo es, que es justo lo que la gráfica debe detectar.</p>
<h2>Por qué la desviación global se engaña</h2>
<p>La desviación global mide toda la variación de los datos, incluida la que provoca una causa especial. Si a mitad del muestreo la media sube, los datos quedan repartidos en dos grupos y s crece. Los límites se abren y los puntos desplazados quedan dentro.</p>
<p>Los rangos móviles solo comparan datos vecinos. Un corrimiento sostenido afecta un único rango móvil, el del momento del cambio, así que σ̂ casi no se mueve.</p>
<p>Con los datos de la línea de llenado de esta página: sin corrimiento, s = 1.03 ml y σ̂ = 1.04 ml, casi iguales, como debe ser en un proceso estable. Con un corrimiento de 4 ml a partir de la observación 16, s sube a 2.18 ml, mientras σ̂ queda en 1.19 ml. <strong>Mientras más grande es el problema, más anchos son los límites globales.</strong></p>
<h2>Pruébalo</h2>
<p>Mueve el tamaño del corrimiento y el momento en que ocurre. Compara cuántos puntos marca cada método.</p>
<!--W-->
<h2>Qué muestra el ejemplo</h2>
<ul><li>Con un corrimiento a la mitad de la serie, los límites con MR̄ marcan puntos fuera desde 1.5 ml de cambio. Los límites con la desviación global no marcan ninguno, ni siquiera con 5 ml.</li>
<li>Cuando el cambio dura lo suficiente, la regla de rachas también lo detecta: 8 puntos seguidos del mismo lado de la media. Por eso las reglas de rachas no son un adorno.</li>
<li>Un corrimiento pequeño y reciente, por ejemplo 2 ml en las últimas 5 observaciones, no lo detecta ningún método todavía. Una gráfica de control no es magia: avisa cuando la evidencia se acumula.</li>
<li>En ninguno de estos escenarios la desviación global marcó un punto fuera.</li></ul>
<h2>Entonces, ¿la desviación global no sirve?</h2>
<p>Sí sirve, pero para otra pregunta. Describe cuánto varió todo lo que pasó y es la base de Pp y Ppk, los índices de desempeño. Lo que no debe hacer es definir los límites que juzgan si el proceso cambió.</p>
<div class="opinion"><span class="label">Opinión del autor</span><p>En cursos introductorios es común calcular los límites con la desviación de los datos, porque los alumnos ya la conocen y, con un proceso estable, el resultado se parece. Creo que vale la pena enseñar los dos métodos lado a lado: la diferencia entre ellos es, en sí misma, una señal de que algo cambió.</p></div>
<h2>Regla práctica</h2>
<ol><li>Para gráficas de individuales, estima σ con MR̄ / 1.128.</li><li>Usa la desviación global para describir el desempeño (Pp, Ppk), no para trazar límites.</li><li>Si s es bastante mayor que MR̄ / 1.128, sospecha un cambio en el proceso y revisa la gráfica con reglas de rachas.</li></ol>`},
  {id:'excel-minitab-python', k:'probamos', f:'Lo probamos', t:'La misma gráfica I-MR en Excel, Minitab y Python',
   d:'Los mismos 25 datos de la línea de llenado: qué resultado debe salir, cómo se hace en cada herramienta y cuánto tardé en Excel (8 min) y en Python (2 min).',
   l:'imr', fecha:'Octubre de 2026', status:'pub',
   refs:['NIST/SEMATECH e-Handbook of Statistical Methods, sec. 6.3.2.2. <a href="https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc322.htm" target="_blank" rel="noopener">Individuals control charts</a>.','Minitab. Ayuda de Minitab: I-MR Chart, métodos y fórmulas.','<a href="https://colab.research.google.com/" target="_blank" rel="noopener">Google Colab</a>: entorno gratuito para ejecutar Python en el navegador.'],
   body:`<p class="lead">Misma pregunta, mismos 25 datos, tres herramientas: ¿el proceso de llenado es estable? Antes de comparar qué tan fácil es cada una, hay que saber qué resultado debe salir.</p>
<h2>El resultado que debe salir</h2>
<p>Con los 25 volúmenes de la <a href="#f-imr">ficha I-MR</a>, cualquier herramienta bien usada debe dar:</p>
<div class="tscroll"><table class="etable"><thead><tr><th>Valor</th><th style="text-align:right">Resultado</th></tr></thead><tbody>
<tr><td>Media (línea central)</td><td class="out">501.38 ml</td></tr><tr><td>Rango móvil promedio (MR̄)</td><td class="out">1.17 ml</td></tr>
<tr><td>Límite de control superior (LCS)</td><td class="out">504.49 ml</td></tr><tr><td>Límite de control inferior (LCI)</td><td class="out">498.27 ml</td></tr>
<tr><td>LCS de la gráfica MR</td><td class="out">3.83 ml</td></tr><tr><td>Puntos fuera de control</td><td class="out">Ninguno</td></tr></tbody></table></div>
<p>Si tu herramienta da otros números, revisa primero que los datos estén en orden de producción y cómo se estimó σ. Los datos están en <a href="#plantillas">Plantillas</a>.</p>
<h2>En Excel</h2>
<ol><li>Pega los 25 datos en la columna A, de A2 a A26.</li><li>En B3 escribe <code>=ABS(A3-A2)</code> y cópiala hasta B26: son los rangos móviles.</li><li>Calcula la media con <code>=PROMEDIO(A2:A26)</code> y el rango móvil promedio con <code>=PROMEDIO(B3:B26)</code>.</li><li>Calcula LCS = media + 2.66 × MR̄ y LCI = media − 2.66 × MR̄.</li><li>Haz columnas con la media, el LCS y el LCI repetidos en cada fila, e inserta un gráfico de líneas con los datos y esas tres columnas.</li></ol>
<p><span class="fact">Hecho</span> Excel no tiene un tipo de gráfica de control: todo se arma a mano, y no marca solo los puntos fuera ni las rachas. Según tu configuración regional, el separador de argumentos puede ser coma o punto y coma.</p>
<h2>En Minitab</h2>
<ol><li>Pega los datos en una columna.</li><li>Menú <strong>Estadísticas → Gráficas de control → Gráficas de variables para individuos → I-MR</strong> (en inglés: <em>Stat → Control Charts → Variables Charts for Individuals → I-MR</em>).</li><li>Selecciona la columna y acepta.</li><li>Para activar las reglas de rachas, entra a <strong>Opciones → Pruebas</strong>.</li></ol>
<p><span class="fact">Hecho</span> Minitab calcula la gráfica completa, I y MR, y por defecto estima σ con el rango móvil promedio, igual que esta página. Los nombres exactos de los menús pueden variar según la versión.</p>
<h2>En Python (Google Colab)</h2>
<p>Copia el código en una celda de Colab y ejecútalo. Solo usa Python básico y matplotlib, que Colab ya trae instalado.</p>
<div class="codebox"><button class="btn" data-copycode>Copiar código</button><pre class="code"><code>import matplotlib.pyplot as plt

# Volumen de llenado (ml) en orden de producción: datos de Industrial Toolkit
datos = [501.3, 501.8, 500.8, 501.7, 502.3, 501.8, 503.0, 500.3, 501.4, 500.5,

# 2. Línea central y límites de control

# 3. Puntos fuera de control

print(f&quot;Media {media:.2f} | MR prom. {mr_prom:.2f} | LCS {lcs:.2f} | LCI {lci:.2f} | LCS MR {lcs_mr:.2f}&quot;)
print(&quot;Puntos fuera de control:&quot;, fuera or &quot;ninguno&quot;)

# 4. Gráficas I y MR
obs = range(1, len(datos) + 1)
fig, (g1, g2) = plt.subplots(2, 1, figsize=(8, 6), sharex=True)
g1.plot(obs, datos, marker=&quot;o&quot;)
g1.axhline(media, color=&quot;green&quot;)
for limite in (lcs, lci):
    g1.axhline(limite, color=&quot;red&quot;, linestyle=&quot;--&quot;)
g1.set_title(&quot;Gráfica I&quot;)
g2.plot(obs[1:], mr, marker=&quot;o&quot;)
g2.axhline(mr_prom, color=&quot;green&quot;)
g2.axhline(lcs_mr, color=&quot;red&quot;, linestyle=&quot;--&quot;)
g2.set_title(&quot;Gráfica MR&quot;)
g2.set_xlabel(&quot;Observación&quot;)
plt.tight_layout()
plt.show()</code></pre></div>

  {id:'sigma', k:'cambio', f:'Del concepto a la práctica', t:'¿De dónde sale el 3.4 por millón de Seis Sigma?',
   d:'Una normal a ±6σ deja unas 2 partes por mil millones fuera, no 3.4 por millón. La diferencia es una convención: el desplazamiento de 1.5σ.',
   l:'dpmo', fecha:'Octubre de 2026', status:'pub', widget:'sigma',
   refs:['Montgomery, D. C. Introduction to Statistical Quality Control. Wiley. Sección sobre Seis Sigma.','Pyzdek, T. y Keller, P. The Six Sigma Handbook. McGraw-Hill.','Harry, M. y Schroeder, R. (2000). Six Sigma: The Breakthrough Management Strategy Revolutionizing the World’s Top Corporations. Currency.','Wheeler, D. J. Columnas sobre el desplazamiento de 1.5σ en Quality Digest.'],
   body:`<p class="lead">Seis Sigma se asocia con 3.4 defectos por millón de oportunidades. Pero si calculas cuánto de una distribución normal queda más allá de ±6σ, obtienes unas 2 partes por mil millones. La diferencia es una convención: el desplazamiento de 1.5σ.</p>
<h2>La cuenta que no cuadra</h2>
<p>Un proceso "seis sigma" tiene sus límites de especificación a 6 desviaciones estándar de la media. Si el proceso está centrado y es normal, la fracción fuera es:</p>
<div class="eq">2 × P(Z &gt; 6) ≈ 0.000000002 → unas 0.002 partes por millón</div>
<p>No 3.4. Para llegar a 3.4 hace falta un supuesto adicional.</p>
<h2>El supuesto: la media se mueve 1.5σ</h2>
<p><span class="fact">Hecho</span> La metodología Seis Sigma, desarrollada en Motorola en la década de 1980, supone que a largo plazo la media de un proceso se desplaza hasta 1.5σ respecto de su posición de corto plazo. Si la media se acerca 1.5σ a un límite, ese límite queda a 6 − 1.5 = 4.5σ:</p>
<div class="eq">P(Z &gt; 4.5) ≈ 0.0000034 → 3.4 por millón</div>
<p>El otro límite queda a 7.5σ y su aporte es despreciable.</p>
<h2>Pruébalo</h2>
<p>Elige un nivel sigma y un desplazamiento. Con 6σ y 1.5σ de desplazamiento obtienes el famoso 3.4. Pon el desplazamiento en cero y mira cuánto cambia.</p>
<!--W-->
<h2>Una convención, no una medición</h2>
<p><span class="fact">Hecho</span> El 1.5σ no se calcula con los datos de tu proceso. Es un valor fijo que se adoptó como regla general para traducir entre desempeño de corto y largo plazo. Mikel Harry, uno de los principales promotores de Seis Sigma, lo justificó con argumentos de acumulación de tolerancias. Otros autores, como Donald J. Wheeler, han cuestionado que sea una regla universal.</p>
<div class="opinion"><span class="label">Opinión del autor</span><p>El 1.5σ es útil como lenguaje común para comparar procesos, pero no reemplaza medir. Si tienes datos de largo plazo, usa el DPMO observado o Ppk directamente, y reporta qué convención usaste.</p></div>
<h2>Cómo lo usa la calculadora de esta página</h2>
<p>Cuando calculas el nivel sigma a partir de defectos observados, el DPMO ya refleja el largo plazo. Por eso se suma 1.5:</p>
<div class="eq">Nivel sigma = Φ⁻¹(1 − DPO) + 1.5</div>
<p>En el ejemplo de los celulares, DPMO = 125,000, z = 1.15 y el nivel sigma reportado es 2.65σ. Sin la convención, sería 1.15σ. Las tablas de nivel sigma suelen considerar solo la cola cercana, por eso en niveles bajos verás números ligeramente distintos a los del experimento de arriba, que suma ambas colas.</p>
<h2>Regla práctica</h2>
<ol><li>Cuando leas "3.4 DPMO", recuerda que incluye un desplazamiento supuesto de 1.5σ.</li><li>Al reportar un nivel sigma, aclara si sumaste el 1.5.</li><li>Para decisiones sobre tu proceso, usa sus datos: DPMO observado, Ppk y gráficas de control.</li></ol>`}
];

      <div class="calc-in"><div class="field"><label for="ps-z">Nivel sigma (límites a ±kσ): <span id="ps-zv" class="mono"></span></label><input id="ps-z" type="range" min="1" max="6" step="0.5" value="6"></div>
      <div class="field"><label for="ps-s">Desplazamiento de la media: <span id="ps-sv" class="mono"></span></label><input id="ps-s" type="range" min="0" max="2" step="0.1" value="1.5"></div></div>

    ['ps-z','ps-s'].forEach(i=>$('#'+i).addEventListener('input',run)); run();
    function run(){

      $('#ps-zv').textContent=fmt(k,1)+'σ'; $('#ps-sv').textContent=fmt(sh,1)+'σ';

      const area=(a,b)=>{let p=`M${xs(a)} ${T+ph}`;for(let i=0;i<=60;i++){const v=a+(b-a)*i/60;p+=` L${xs(v)} ${ys(v)}`}return p+` L${xs(b)} ${T+ph}Z`};
      let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución desplazada y límites">`;

      svg+=`<path d="M${Array.from({length:151},(_,i)=>{const v=lo+(hi-lo)*i/150;return `${xs(v)} ${ys(v)}`}).join(' L')}" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
      [[-k,'LIE'],[k,'LSE']].forEach(([v,t])=>svg+=`<line x1="${xs(v)}" x2="${xs(v)}" y1="${T-6}" y2="${T+ph}" stroke="var(--bad)" stroke-width="2"/><text x="${xs(v)}" y="${T-8}" text-anchor="middle">${t} ${v>0?'+':''}${fmt(v,1)}σ</text>`);
      svg+=`<line x1="${xs(0)}" x2="${xs(0)}" y1="${T}" y2="${T+ph}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${xs(0)}" y="${H-6}" text-anchor="middle">nominal</text>`;
      if(sh>0) svg+=`<line x1="${xs(sh)}" x2="${xs(sh)}" y1="${T}" y2="${T+ph}" stroke="var(--accent)"/><text x="${xs(sh)+4}" y="${H-6}">media +${fmt(sh,1)}σ</text>`;

      $('#ps-out').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><small>DPMO con desplazamiento de ${fmt(sh,1)}σ</small><div class="v" style="color:var(--accent)">${f(dp)}</div></div><div class="kpi"><small>DPMO con el proceso centrado</small><div class="v">${f(d0)}</div></div><div class="kpi"><small>Límite más cercano</small><div class="v">${fmt(k-sh,1)}σ</div></div></div>
        <div style="padding:16px;border-top:1px solid var(--line)">${svg}</div>

    }

let XP={times:[],early:0,phase:'idle',t0:0,timer:null};
const XP_N=20;
function viewExperimento(){
  return `<div class="wrap page"><div class="crumbs" style="padding:0"><a href="#casos">Casos prácticos</a> / Experimento</div>
  <div><span class="label">Control de procesos · Experimento interactivo</span><h1>¿Eres un proceso estable?</h1><p class="lead">Tu tiempo de reacción es un proceso: tiene un promedio, varía y a veces aparecen causas especiales, como una distracción. Haz ${XP_N} intentos y analiza tus propios datos.</p></div>
  <button class="xp" id="xp" type="button"></button>
  <div class="btns"><button class="btn" id="xp-reset">Reiniciar</button><button class="btn" id="xp-copy">Copiar mis tiempos</button>
    <div class="field" style="grid-template-columns:auto 90px;align-items:center;gap:8px;display:grid"><label for="xp-lse">Especificación: máximo (ms)</label><input id="xp-lse" type="number" value="400"></div></div>
  <div class="tries" id="xp-tries"></div>
  <div id="xp-out"></div>
  <p class="note">Instrucciones: toca el recuadro para empezar. Cuando se ponga verde, tócalo lo más rápido posible. También funciona con la barra espaciadora. Si tocas antes del verde, el intento no cuenta.</p></div>`;
}
function xpRender(){
  const b=$('#xp'); if(!b) return;
  const n=XP.times.length, last=XP.times[n-1];
  const txt={idle:n?`${Math.round(last)} ms<small>Toca para el intento ${n+1} de ${XP_N}</small>`:`Toca para empezar<small>${XP_N} intentos</small>`,
    wait:'Espera el verde…<small>No toques todavía</small>', go:'¡Ahora!', early:'Muy pronto<small>Ese intento no cuenta. Toca para repetir.</small>',
    done:`Listo: ${XP_N} intentos<small>Revisa tus resultados abajo</small>`}[XP.phase];
  b.className='xp '+(XP.phase==='idle'?'':XP.phase); b.innerHTML=txt;
  xpResults();
}
function xpPress(){
  if(XP.phase==='go'){XP.times.push(performance.now()-XP.t0);XP.phase=XP.times.length>=XP_N?'done':'idle';return xpRender()}
  if(XP.phase==='wait'){clearTimeout(XP.timer);XP.early++;XP.phase='early';return xpRender()}
  if(XP.phase==='done') return;
  XP.phase='wait'; xpRender();
  XP.timer=setTimeout(()=>{XP.phase='go';XP.t0=performance.now();xpRender()},1200+Math.random()*2300);
}
function xpResults(){
  const o=$('#xp-out'), t=XP.times, lse=+$('#xp-lse').value;
  const S=t.length>=2?imrStats(t,0,lse>0?lse:400):null;
  $('#xp-tries').innerHTML=t.map((v,i)=>`<span class="${S&&t.length>=5&&S.outPts.includes(i)?'out':''}" title="Intento ${i+1}">${Math.round(v)}</span>`).join('');
  if(t.length<5){o.innerHTML=t.length?`<p class="note">Lleva al menos 5 intentos para ver tu gráfica de control.</p>`:'';return}
  const cps=(lse-S.mean)/(3*S.sw), best=Math.min(...t);
  const msg=S.stable?'Eres un proceso estable: tu variación es de causas comunes.':`Hay señales de causas especiales: ${S.outPts.length?`intento${S.outPts.length>1?'s':''} ${S.outPts.map(i=>i+1).join(', ')} fuera de límites`:''}${S.outPts.length&&S.run8>=0?' y ':''}${S.run8>=0?'una racha de 8 del mismo lado de la media':''}. ¿Te distrajiste o fuiste mejorando con la práctica?`;
  o.innerHTML=`<div class="calc">
    <div class="verdict ${S.stable?'v-ok':'v-warn'}"><span class="light"></span>${msg}</div>
    <div class="kpis"><div class="kpi"><small>Intentos válidos</small><div class="v">${t.length}</div><small>${XP.early} anticipados</small></div><div class="kpi"><small>Promedio</small><div class="v">${fmt(S.mean,0)} ms</div></div><div class="kpi"><small>σ̂ (MR̄ / 1.128)</small><div class="v">${fmt(S.sw,0)} ms</div></div><div class="kpi"><small>Cps contra ${fmt(lse,0)} ms</small>${S.stable?`<div class="v">${fmt(cps)}</div>`:'<div class="v na">No interpretable</div>'}</div></div>
    <div class="charts" style="grid-template-columns:1fr"><figure><figcaption>Gráfica I de tus tiempos (ms)</figcaption>${iChart(t,S.mean,S.ucl,S.lcl)}</figure></div>
    <div class="interp">Tu mejor intento fue de ${fmt(best,0)} ms, pero un proceso no se juzga por su mejor resultado. En la dinámica de clase gana el mejor tiempo; en control de procesos importa el promedio y qué tan consistente eres. ${S.stable?(cps>=1.33?'Cumples la especificación con margen.':cps>=1?'Cumples la especificación con poco margen.':'Tu variación no cabe en la especificación: con este proceso, algunos intentos pasarán de '+fmt(lse,0)+' ms.'):'Antes de evaluar si cumples la especificación, identifica las causas especiales.'}</div></div>`;
}
function initExperimento(){
  $('#xp').addEventListener('pointerdown',e=>{e.preventDefault();xpPress()});
  $('#xp').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();xpPress()}});
  $('#xp-reset').onclick=()=>{clearTimeout(XP.timer);XP={times:[],early:0,phase:'idle',t0:0,timer:null};xpRender()};
  $('#xp-copy').onclick=()=>copyText(['Intento\tTiempo (ms)',...XP.times.map((v,i)=>`${i+1}\t${Math.round(v)}`)].join('\n'));
  $('#xp-lse').addEventListener('input',xpResults);
  xpRender();
}

function iChart(x,mean,ucl,lcl){
  const W=560,H=220,L=10,R=88,T=12,B=22,pw=W-L-R,ph=H-T-B;
  const lo=Math.min(lcl,...x), hi=Math.max(ucl,...x), pad=(hi-lo)*.08;
  const y=v=>T+ph-((v-(lo-pad))/((hi+pad)-(lo-pad)))*ph, xs=i=>L+(i/(x.length-1))*pw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de individuales con límites de control">`;
  [[ucl,'LCS'],[lcl,'LCI']].forEach(([v,t])=>s+=`<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="${L+pw+6}" y="${y(v)+3}">${t} ${fmt(v,1)}</text>`);
  s+=`<line x1="${L}" x2="${L+pw}" y1="${y(mean)}" y2="${y(mean)}" stroke="var(--accent)"/><text x="${L+pw+6}" y="${y(mean)+3}">LC ${fmt(mean,1)}</text>`;
  s+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.2" points="${x.map((v,i)=>`${xs(i)},${y(v)}`).join(' ')}"/>`;
  x.forEach((v,i)=>{const o=v>ucl||v<lcl;s+=`<circle cx="${xs(i)}" cy="${y(v)}" r="${o?4.5:3}" fill="${o?'var(--bad)':'var(--fg)'}"/>`});
  s+=`<text x="${L}" y="${H-4}">obs. 1</text><text x="${L+pw}" y="${H-4}" text-anchor="end">obs. ${x.length}</text></svg>`;
  return s;
}
function hist(x,lie,lse,mean){
  const W=400,H=220,L=40,R=40,T=26,B=22,pw=W-L-R,ph=H-T-B;
  const lo=Math.min(lie,...x)-0.5, hi=Math.max(lse,...x)+0.5, k=10, bw=(hi-lo)/k;
  const bins=Array(k).fill(0); x.forEach(v=>bins[Math.min(k-1,Math.floor((v-lo)/bw))]++);
  const m=Math.max(...bins), xs=v=>L+((v-lo)/(hi-lo))*pw;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histograma con límites de especificación">`;
  bins.forEach((c,i)=>{const h=c/m*ph; if(c) s+=`<rect x="${xs(lo+i*bw)+1}" y="${T+ph-h}" width="${pw/k-2}" height="${h}" fill="var(--accent)" opacity=".75" rx="1"/>`});
  [[lie,'LIE'],[lse,'LSE']].forEach(([v,t])=>s+=`<line x1="${xs(v)}" x2="${xs(v)}" y1="${T-6}" y2="${T+ph}" stroke="var(--bad)" stroke-width="2"/><text x="${xs(v)}" y="${T-10}" text-anchor="middle">${t} ${fmt(v,0)}</text>`);
  s+=`<line x1="${xs(mean)}" x2="${xs(mean)}" y1="${T}" y2="${T+ph}" stroke="var(--fg)" stroke-dasharray="3 3"/>`;
  s+=`<line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)"/><text x="${xs(mean)}" y="${H-4}" text-anchor="middle">x̄ ${fmt(mean,1)}</text></svg>`;
  return s;
}
function paretoSVG(data){
  const sorted=[...data].sort((a,b)=>b[1]-a[1]), tot=sorted.reduce((a,b)=>a+b[1],0); let acc=0;
  const rows=sorted.map(([k,v])=>{acc+=v;return {k,v,c:acc/tot}});
  const W=560,H=240,L=10,R=40,T=14,B=44,pw=W-L-R,ph=H-T-B,bw=pw/rows.length;
  const max=rows[0].v||1, y=v=>T+ph-(v/max)*ph, yc=c=>T+ph-c*ph;
  const vital=rows.findIndex(r=>r.c>=0.8);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de Pareto">`;
  s+=`<line x1="${L}" x2="${L+pw}" y1="${yc(.8)}" y2="${yc(.8)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${L+pw+4}" y="${yc(.8)+3}">80 %</text>`;
  rows.forEach((r,i)=>{const x=L+i*bw+bw*.15;s+=`<rect x="${x}" y="${y(r.v)}" width="${bw*.7}" height="${T+ph-y(r.v)}" fill="${i<=vital?'var(--accent)':'var(--line)'}" rx="2"/><text x="${x+bw*.35}" y="${y(r.v)-4}" text-anchor="middle">${r.v}</text><text x="${x+bw*.35}" y="${H-B+16}" text-anchor="middle">${esc(r.k.length>14?r.k.slice(0,13)+'…':r.k)}</text>`});
  s+=`<polyline fill="none" stroke="var(--fg)" stroke-width="1.5" points="${rows.map((r,i)=>`${L+i*bw+bw/2},${yc(r.c)}`).join(' ')}"/>`;
  rows.forEach((r,i)=>s+=`<circle cx="${L+i*bw+bw/2}" cy="${yc(r.c)}" r="3" fill="var(--fg)"/><text x="${L+i*bw+bw/2+5}" y="${yc(r.c)-6}">${Math.round(r.c*100)}%</text>`);
  s+=`<line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)"/></svg>`;
  return s;
}
function ganttSVG(res){
  const rows=res.rows, T=res.T, LW=170, W=640, RH=26, TOP=24, H=TOP+rows.length*RH+8, pw=W-LW-10;
  const x=d=>LW+(d/T)*pw, step=T<=12?1:T<=30?2:5;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de Gantt con ruta crítica">`;
  for(let d=0;d<=T;d+=step) s+=`<line x1="${x(d)}" x2="${x(d)}" y1="${TOP-6}" y2="${H-8}" stroke="var(--grid)"/><text x="${x(d)}" y="${TOP-10}" text-anchor="middle">${d}</text>`;
  rows.forEach((a,i)=>{const yy=TOP+i*RH+4;
    s+=`<text x="0" y="${yy+13}" style="fill:${a.crit?'var(--accent)':'var(--fg)'};font-size:11px">${esc(a.id)} · ${esc(String(a.n||'').slice(0,20))}</text>`;
    if(a.slack>0) s+=`<rect x="${x(a.ef)}" y="${yy+3}" width="${x(a.lf)-x(a.ef)}" height="12" fill="none" stroke="var(--muted)" stroke-dasharray="3 2" rx="2"/>`;
    s+=`<rect x="${x(a.es)}" y="${yy}" width="${Math.max(2,x(a.ef)-x(a.es))}" height="18" rx="3" fill="${a.crit?'var(--accent)':'var(--muted)'}" ${a.crit?'':'opacity=".5"'}/>`;
  });
  s+=`<text x="${W-10}" y="${H-1}" text-anchor="end">días</text></svg>`;
  return s;
}

        {s: spec?'ok':'bad', t: spec?'Límites confirmados como especificaciones.':'Confirma que LIE y LSE son especificaciones. No se puede calcular capacidad contra límites de control.'},

        ${D.some(d=>d.n<10)?'<ul class="gates"><li><span class="g warn">!</span><span>Algún grupo tiene menos de 10 datos: las diferencias pueden ser casualidad.</span></li></ul>':''}

  normal(el){
    el.innerHTML=`<div class="calc"><div class="calc-head"><h3>¿Cuánto queda fuera de tolerancia?</h3><button class="btn" id="n-ex">Ejemplo de clase: tornillos</button></div>
      <div class="calc-in" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        <div class="field"><label for="n-m">Media μ</label><input id="n-m" type="number" step="any"></div>
        <div class="field"><label for="n-s">Desviación σ</label><input id="n-s" type="number" step="any"></div>
        <div class="field"><label for="n-l">LIE (opcional)</label><input id="n-l" type="number" step="any"></div>
        <div class="field"><label for="n-u">LSE (opcional)</label><input id="n-u" type="number" step="any"></div>
      </div><div id="n-out"></div></div>`;
    const load=()=>{$('#n-m').value=10;$('#n-s').value=0.25;$('#n-l').value=9.5;$('#n-u').value=10.5;run()};
    $('#n-ex').onclick=load; ['n-m','n-s','n-l','n-u'].forEach(i=>$('#'+i).addEventListener('input',run)); load();
    function run(){
      const m=+$('#n-m').value, sd=+$('#n-s').value, ls=$('#n-l').value.trim(), us=$('#n-u').value.trim(), L=ls===''?null:+ls, U=us===''?null:+us, o=$('#n-out');

      if(L===null&&U===null) return o.innerHTML='<p class="err">Captura al menos un límite de tolerancia.</p>';
      if(L!==null&&U!==null&&!(U>L)) return o.innerHTML='<p class="err">El LSE debe ser mayor que el LIE.</p>';
      const pl=L===null?0:phi((L-m)/sd), pu=U===null?0:1-phi((U-m)/sd), pin=1-pl-pu;
      const W=560,H=210,T=20,B=28,Lm=10,pw=W-20,ph=H-T-B, a=m-4*sd, b=m+4*sd, lo=Math.min(a,L??a), hi=Math.max(b,U??b);
      const xs=v=>Lm+(v-lo)/(hi-lo)*pw, pdf=v=>Math.exp(-(((v-m)/sd)**2)/2), ys=v=>T+ph-pdf(v)*ph;
      const area=(x0,x1)=>{if(x1<=x0)return '';let p=`M${xs(x0)} ${T+ph}`;for(let i=0;i<=60;i++){const v=x0+(x1-x0)*i/60;p+=` L${xs(v)} ${ys(v)}`}return p+` L${xs(x1)} ${T+ph}Z`};
      const inL=L??lo, inU=U??hi;
      let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva normal con tolerancias">`;
      svg+=`<path d="${area(Math.max(lo,inL),Math.min(hi,inU))}" fill="var(--accent)" opacity=".25"/>`;
      if(L!==null) svg+=`<path d="${area(lo,Math.min(L,hi))}" fill="var(--bad)" opacity=".5"/><line x1="${xs(L)}" x2="${xs(L)}" y1="${T-8}" y2="${T+ph}" stroke="var(--bad)" stroke-width="2"/><text x="${xs(L)}" y="${T-10}" text-anchor="middle">LIE ${L}</text>`;
      if(U!==null) svg+=`<path d="${area(Math.max(U,lo),hi)}" fill="var(--bad)" opacity=".5"/><line x1="${xs(U)}" x2="${xs(U)}" y1="${T-8}" y2="${T+ph}" stroke="var(--bad)" stroke-width="2"/><text x="${xs(U)}" y="${T-10}" text-anchor="middle">LSE ${U}</text>`;
      svg+=`<path d="M${Array.from({length:121},(_,i)=>{const v=lo+(hi-lo)*i/120;return `${xs(v)} ${ys(v)}`}).join(' L')}" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
      [-3,-2,-1,0,1,2,3].forEach(k=>{const v=m+k*sd;if(v>=lo&&v<=hi)svg+=`<line x1="${xs(v)}" x2="${xs(v)}" y1="${T+ph}" y2="${T+ph+5}" stroke="var(--muted)"/><text x="${xs(v)}" y="${T+ph+17}" text-anchor="middle">${k?(k>0?'+':'')+k+'σ':'μ'}</text>`});
      svg+=`<line x1="${Lm}" x2="${Lm+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)"/></svg>`;
      const zl=L===null?null:(L-m)/sd, zu=U===null?null:(U-m)/sd;
      o.innerHTML=`<div class="kpis"><div class="kpi"><small>Debajo del LIE</small><div class="v">${L===null?'—':fmt(pl*100,2)+' %'}</div><small>${zl===null?'':'z = '+fmt(zl)}</small></div><div class="kpi"><small>Encima del LSE</small><div class="v">${U===null?'—':fmt(pu*100,2)+' %'}</div><small>${zu===null?'':'z = '+fmt(zu)}</small></div><div class="kpi"><small>Dentro de tolerancia</small><div class="v">${fmt(pin*100,2)} %</div></div><div class="kpi"><small>Fuera, en ppm</small><div class="v">${fmt((pl+pu)*1e6,0)}</div></div></div>
        <div style="padding:16px;border-top:1px solid var(--line)">${svg}</div>
        <div class="interp">${L!==null&&U!==null&&Math.abs((L+U)/2-m)<sd*0.05?`La media está centrada en el nominal y aun así el ${fmt((pl+pu)*100,2)} % queda fuera: la tolerancia está a solo ${fmt(Math.min(-zl,zu),1)} desviaciones de la media. Centrar no basta; hay que reducir la variación.`:`Se espera que el ${fmt((pl+pu)*100,2)} % quede fuera de tolerancia${pl>pu*3?', casi todo por debajo del LIE':pu>pl*3?', casi todo por encima del LSE':''}.`} Este cálculo supone normalidad y un proceso estable.</div>`;
    }
  },
  binomial(el){
    el.innerHTML=`<div class="calc"><div class="calc-head"><h3>Probabilidad binomial</h3><div class="btns"><button class="btn" id="b-ex1">Ejemplo de clase: caja de 10</button><button class="btn" id="b-ex2">Ejemplo de clase: lote de chips</button></div></div>
      <div class="calc-in" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
        <div class="field"><label for="b-n">Piezas en la muestra (n)</label><input id="b-n" type="number" min="1" max="500"></div>
        <div class="field"><label for="b-p">% defectuoso (p)</label><input id="b-p" type="number" step="any" min="0" max="100"></div>
        <div class="field"><label for="b-k">Defectuosas (k)</label><input id="b-k" type="number" min="0"></div>
        <div class="field"><label for="b-N">Tamaño del lote (opcional)</label><input id="b-N" type="number" min="1" placeholder="Ej. 50"></div>
      </div>
      <div style="padding:0 16px 12px"><div class="choice" id="b-mode"><button data-m="eq" aria-pressed="true">Exactamente k</button><button data-m="le" aria-pressed="false">Como máximo k</button><button data-m="ge" aria-pressed="false">Al menos k</button></div></div>
      <div id="b-out"></div></div>`;
    let mode='eq';
    const load=(n,p,k)=>{$('#b-n').value=n;$('#b-p').value=p;$('#b-k').value=k;run()};

    ['b-n','b-p','b-k','b-N'].forEach(i=>$('#'+i).addEventListener('input',run)); load(10,2,0);
    function run(){
      const n=Math.round(+$('#b-n').value), p=+$('#b-p').value/100, k=Math.round(+$('#b-k').value), Nl=+$('#b-N').value, o=$('#b-out');

      if(!(k>=0&&k<=n)) return o.innerHTML='<p class="err">k debe estar entre 0 y n.</p>';
      const f=binomPMF(n,p), sel=x=>mode==='eq'?x===k:mode==='le'?x<=k:x>=k, P=f.reduce((s,v,x)=>s+(sel(x)?v:0),0);
      let top=n; while(top>k+1&&f[top]<0.001&&top>n*p+3) top--; top=Math.max(top,Math.min(n,k+2));
      const W=560,H=200,T=16,B=26,Lm=10,pw=W-20,ph=H-T-B,bw=pw/(top+1),mx=Math.max(...f.slice(0,top+1));
      let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribución binomial">`;
      for(let x=0;x<=top;x++){const h=f[x]/mx*ph;svg+=`<rect x="${Lm+x*bw+bw*.12}" y="${T+ph-h}" width="${bw*.76}" height="${h}" rx="2" fill="${sel(x)?'var(--accent)':'var(--line)'}"/>`;if(top<=25||x%Math.ceil(top/25)===0)svg+=`<text x="${Lm+x*bw+bw/2}" y="${H-10}" text-anchor="middle">${x}</text>`;if(top<=12)svg+=`<text x="${Lm+x*bw+bw/2}" y="${T+ph-h-4}" text-anchor="middle">${fmt(f[x]*100,1)}%</text>`}
      svg+=`<line x1="${Lm}" x2="${Lm+pw}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)"/></svg>`;
      const hyper=Nl>0&&n/Nl>0.1;

      o.innerHTML=`${Nl>0&&Nl<n?'<p class="err">El lote no puede ser menor que la muestra.</p>':''}<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><small>P(${label} defectuosa${k===1?'':'s'})</small><div class="v" style="color:var(--accent)">${fmt(P*100,2)} %</div></div><div class="kpi"><small>Defectuosas esperadas (n·p)</small><div class="v">${fmt(n*p,2)}</div></div><div class="kpi"><small>Desviación √(n·p·(1−p))</small><div class="v">${fmt(Math.sqrt(n*p*(1-p)),2)}</div></div></div>
        ${hyper?`<ul class="gates"><li><span class="g warn">!</span><span>La muestra es el ${fmt(n/Nl*100,0)} % del lote. Si se inspecciona sin reemplazo, la probabilidad cambia de pieza a pieza y conviene usar la distribución hipergeométrica.</span></li></ul>`:''}
        <div style="padding:16px;border-top:1px solid var(--line)">${svg}<div class="legend" style="padding:8px 0 0"><span><i style="background:var(--accent)"></i>Casos incluidos</span><span>Eje horizontal: número de defectuosas</span></div></div>
        ${dataTable('Probabilidad de cada número de defectuosas',['Defectuosas','Probabilidad','Incluida'],f.slice(0,top+1).map((p,x)=>[x,fmt(p*100,3)+' %',sel(x)?'Sí':'No']))}
        <div class="interp">Si el ${fmt(p*100,1)} % de las piezas sale defectuoso, la probabilidad de encontrar ${label} defectuosa${k===1?'':'s'} en una muestra de ${n} es ${fmt(P*100,2)} %.${mode==='eq'&&k===0?` Dicho de otro modo: ${fmt((1-P)*100,1)} % de las ${n===10?'cajas':'muestras'} tendrá al menos una defectuosa.`:''}</div>`;
    }
